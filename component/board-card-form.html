// Slug-aware base (ADR 0042): "" on the host window, "/agents/<slug>" under the fleet
// proxy. The DS kit stylesheet is public (/_ds/), so this opaque-origin, bearer-less
// frame can load it; the --pl-* tokens it reads are re-pointed by the host's theme.

  var l = document.createElement("link");
  l.rel = "stylesheet";
  l.href = base + "/_ds/plugin-kit.css";
  document.head.appendChild(l);
})();
</script>
