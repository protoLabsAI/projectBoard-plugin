id: project_board
name: Project Board (coding orchestration)
version: 0.71.0
description: >-
  A board-driven coding-orchestration plugin: a lean 6-state board (backlog → ready
  → in_progress → in_review → done, + a blocked flag) backed by **beads** (`br`), an
  ACP **spawn loop**, an adversarial **planning layer**, and a Kanban/list **console
  view**. The lead agent is the orchestrator: it pulls `ready` features, dispatches a
  coder (`acp` delegate, e.g. `proto`) into a disposable per-feature git worktree,
  opens a PR, and a merge webhook sets `done` — the single external Done edge.

  Composes the already-built `delegates` plugin (ADR 0024/0025) — it does NOT
  reimplement the spawn primitive. The board is a projection over beads (no separate
  store to drift). Planning is two reasoning subagents (`decompose` + `antagonist`)
  driven by the `decompose-project` skill. Requires the **`br`** (beads) CLI on PATH,
  the `gh` CLI, and `plugins.enabled: [delegates]` with an `acp` coder declared AND
  named in `coder:` (no default). A setup preflight checks all four at register time
  and every loop tick, reports gaps as host operator warnings + on the board page,
  and pauses the loop (instead of ticking into tracebacks) until they pass.

  Ships DISABLED; enable with `plugins: { enabled: [delegates, project_board] }`.
enabled: false
repository: https://github.com/protoLabsAI/projectBoard-plugin
min_protoagent_version: "0.185.0"  # infra.clock.wait_for: sleep-aware coder timeouts (#472, protoAgent #3724); callable HOST.apply_settings (#2743); settings_tabs (#3179/#3180)

# Plugin config (read from `project_board:` in langgraph-config.yaml).
config_section: project_board
secrets: [webhook_secret, npm_token]
config:
  coder: ""                 # acp delegate name the loop dispatches builds to. NO DEFAULT
                            # (v0.42.0): unset = the setup preflight fails `coder`, the host
                            # shows an operator warning, and the loop pauses (no tracebacks)
                            # until a delegate is declared and named here — never a phantom
                            # name that only resolves on one machine. LIVE (console field):
                            # a save applies to the running loop's next dispatch/check.
                            # Blank + a `coders` ladder below: the ladder must then cover
                            # EVERY tier (standard/reasoning/advanced) in every project map — an
                            # unmapped tier dispatches to '' and blocks the card.
  # Escalation is OPT-IN and only meaningful with >1 distinct coder. Leave this
  # out for a single-ACP-agent setup (no tier ladder, no redundant retries —
  # one dispatch, then Blocked on failure; `difficulty` is then ignored).
  # Legacy tier names smart and opus are still accepted (standard and advanced).
  # routing:
  #   exclusive: [codex]    # strict coder allowlist; project routing.exclusive overrides.
  #                        # Empty/absent preserves normal fallback; exhaustion blocks.
  #                        # Helpers/review/solve offload are not covered (see configuration docs).
  # coders:                 # tier → delegate; difficulty picks the starting rung.
  #   standard: proto       # rungs are standard → reasoning → advanced (store.TIER_LADDER);
  #   reasoning: proto-smart  # with `coder:` set it is the fallback for an unmapped rung,
  #   advanced: claude-acp  # with `coder:` blank every rung must be mapped.
  reviewer: quinn           # a2a delegate for explicit PR review (review_dispatch, and the
                            # review_gate's fallback when the host has no workflow runner)
  review_dispatch: false    # OPT-IN, advisory. Off = rely on the fleet PR-review pipeline (it
                            # reviews PRs on open). On = also delegate_to(reviewer) — for repos
                            # with no pipeline; needs a reachable `reviewer` a2a delegate.
  review_gate: false        # OPT-IN, BLOCKING (plan M5). On = after open_review the loop runs
                            # the host's adversarial `code-review` workflow (ADR 0077) on the
                            # PR, parses the findings convention, and bounces blocking findings
                            # (blocker/major) back to the coder with the findings injected into
                            # the retry prompt — the CI-bounce loop, for review. Sub-states ride
                            # as labels: review-pending / changes-requested. Exhausted budget →
                            # Blocked for human review; never a silent merge. Takes precedence
                            # over review_dispatch when both are on.
  review_workflow: code-review  # the host workflow recipe the gate runs (run_workflow name)
  review_fix_max: 2         # review-bounce re-dispatches before the feature is Blocked
                            # (mirrors ci_fix_max; same-tier — findings are fixable, not a
                            # model-capability ceiling)
  review_run_max: 3         # consecutive UNRUNNABLE gate attempts (no runner / dead
                            # workflow / failed panel steps — a partial panel is NOT a
                            # review, ADR 0078 D3) before Blocking for the operator
  review_gate_timeout_s: 1800  # HARD cap on one review-gate model call (the workflow run,
                            # or the a2a reviewer fallback), the board's own — a hung stream
                            # can outlive the host client's request_timeout (protoAgent#3699).
                            # A timeout counts as an unrunnable review. <= 0 → the default.
  goal_verify: false        # OPT-IN. On = an independent model call checks the coder's diff
                            # against the feature's acceptance_criteria (test coverage is
                            # mandatory even when unlisted) BEFORE opening the PR.
  goal_fix_max: 2           # a goal-verify gap (e.g. missing tests) carries the gap as feedback
                            # + re-dispatches the SAME tier this many times before escalating/
                            # blocking — a missing-tests gap is fixable, not a capability failure.
  local_gate_cmd: ""        # OPT-IN pre-PR gate. The repo's real check command(s) run in the
                            # worktree AFTER fixups and BEFORE opening the PR (e.g.
                            # "ruff check . && uv run --no-sync pytest tests/ -q"). The coder is
                            # edit-only and can't run the suite, so failures on knowable facts
                            # (lint, a golden-map test, a wrong column, version drift) otherwise
                            # only surface in CI and thrash the bounce/escalation ladder. On
                            # failure the SAME coder is handed the output to fix in-worktree
                            # (keep-worktree) so the PR opens already-green. Empty = off.
  local_gate_max: 2         # same-tier in-worktree fix attempts on a gate failure before the PR
                            # opens ANYWAY (CI + ci_fix_max stay the backstop — a flaky or
                            # misconfigured gate never blocks good work).
  local_gate_timeout_s: 600 # hard cap on one gate run; a timeout degrades to "pass" (CI gates).
  coder_solve: true         # OPT-OUT valve for the ADR 0064 P2 board seam (default on;
                            # the real gate is coder_seam.should_use_solve — see below).
                            # On a FRESH build (not a keep-worktree/CI-bounce re-dispatch),
                            # when the `coder` plugin is importable AND the feature has
                            # acceptance_criteria AND coder_solve_test_cmd (or
                            # local_gate_cmd) is set, the loop dispatches through
                            # coder.solve()'s execution-grounded ladder (greedy →
                            # best-of-k → tree-search) instead of a single
                            # delegate_to(acp) shot — gated on the feature's acceptance
                            # tests actually PASSING in a real worktree, never an LLM
                            # judge. Missing any of those three ⇒ honest degrade to
                            # today's single shot (non-regressing by default: the
                            # `coder` plugin ships disabled, and this needs a test
                            # command configured too). Composes WITH the `coders`-map
                            # tier ladder: solve() searches WITHIN a tier; a search
                            # that never passes escalates a tier (or blocks) exactly
                            # like a no-diff dispatch.
  coder_solve_test_cmd: ""  # the command that runs THIS feature's (coder-authored)
                            # acceptance tests in a candidate worktree, e.g.
                            # "pytest tests/ -q" — solve()'s verify() oracle. Blank
                            # falls back to local_gate_cmd (many repos already
                            # configure that as the real test command); still blank
                            # ⇒ no runnable oracle ⇒ honest degrade to the single shot.
  coder_solve_test_timeout_s: 300  # hard cap on one candidate's acceptance-test run;
                            # a timeout is a FAILED verdict (never a silent pass —
                            # this is the ladder's own search oracle, unlike the
                            # fail-open pre-PR local_gate_cmd above).
  coder_solve_budget: 6     # hard cap on total candidate generations across the
                            # whole ladder for one feature build.
  coder_solve_k: 3          # best-of-k width (rung 2): candidates generated (each in
                            # its own throwaway worktree) before execution-select.
  coder_solve_tree_depth: 2 # refine-on-failing-tests depth (rung 3).
  max_concurrent_sessions: 0  # cap on the best-of-k fan-out INSIDE one build (0 = unlimited
                            # within the k budget; 1 = one candidate at a time). Host-wide peak
                            # ACP processes = max_concurrent × min(coder_solve_k, this). LIVE:
                            # a config reload applies it to the next dispatch (console field).
  max_mode_n: 1             # best-of-N "Max-Mode" (borrowed from MiMo-Code). 1 = off. >1 builds a
                            # feature N ways in parallel (N candidate worktrees, all dispatched at
                            # once), a low-temp judge picks the diff that best satisfies
                            # acceptance_criteria, the winner is promoted to the canonical branch
                            # and the losers reaped (#21). Costs N× tokens — gate it to hard work;
                            # only a FROM-SCRATCH build fans out (a CI/goal-fix re-dispatch fixes
                            # the existing diff with one coder). Bound N × max_concurrent to the host.
  project: ""               # OPTIONAL — a `name` from the host's managed-projects
                            # registry (ADR 0095, protoAgent 0.115.0+). Set it and the
                            # board takes that project's `path` as `repo` and its
                            # `default_branch` as `base_branch`, so a project is
                            # declared once instead of repeated here. `repo` /
                            # `base_branch` set to anything OTHER than the defaults
                            # below still win. A name the registry doesn't have is
                            # FATAL (the plugin refuses to load, with the reason on its
                            # entry) — the board creates worktrees, branches and PRs,
                            # so it must never silently fall back to repo "." and build
                            # in the server's cwd.
  repo: "."                 # repo the coders work in (worktrees branch off it)
  base_branch: main         # base branch worktrees/PRs target
  worktrees_root: .worktrees
  loop_enabled: false       # the background puller; off until a board exists
  loop_interval_s: 30       # how often the puller wakes
  coder_timeout_s: 1800     # stuck-drive watchdog: hard cap on one coder dispatch
                            # (30 min). A timeout reaps the coder + is a capability
                            # failure (escalate-or-block), not a transient retry.
                            # 0 disables the cap. The cap counts time the machine
                            # spends asleep (host infra.clock, #472): a coder
                            # dispatched before a Mac sleeps times out at the first
                            # awake moment past the cap, not after 30 AWAKE minutes.
  max_concurrent: 1         # worktree/coder concurrency cap (token + merge cost).
                            # >1 drives that many features in parallel, each in its
                            # own worktree; 1 = serial (the safe default). Parallel
                            # builds whose files_to_modify overlap are serialized (the
                            # hot-file guard) to avoid sure merge conflicts. On a
                            # multi-project board size it to the project count — one
                            # slot per repo — or a deep queue in one project starves
                            # the rest. LIVE: a config reload (console Settings save)
                            # applies it to the running loop's next claim scan; lowering
                            # it never kills an in-flight build.
  max_pending_reviews: 5    # back-pressure: pause claiming new work while this many
                            # PRs already await review (don't pile up faster than they
                            # merge). 0 = unlimited. LIVE (see max_concurrent) — raise
                            # it with max_concurrent or the extra slots idle behind
                            # the review queue.
  dep_gate: merge           # how a blocks-dependency gates its dependents: "merge"
                            # (default, safe) — wait for the blocker to merge (done);
                            # "review" — a NON-foundation blocker releases dependents at
                            # in_review (more parallelism, but builds on un-merged code).
                            # Mark shared-structure features foundation=True; those
                            # always gate on merge regardless.
  merge_poll: true          # poll in_review PRs and reconcile the board to their real
                            # state (merged → done, closed-unmerged → blocked) — the
                            # fallback to /webhook/pr for deployments GitHub can't post
                            # a webhook to (no public URL). Done stays idempotent either
                            # way; set false to rely on the webhook alone.
  merge_poll_interval_s: 60 # how often the loop reconciles in_review PRs
  merge_hold_alert_s: 3600  # a PR GitHub reads not-clean (UNSTABLE/BLOCKED) that the merge
                            # edge correctly refuses, held longer than this, is listed on
                            # /status health (merge_holds) with its hold text and age — like
                            # a claim stall, not left reading `auto-merge pending` (#495).
                            # 0 = off (the per-card next_action hold still shows).
  reconcile_concurrency: 2  # how many in_review/blocked cards' PR reconciles (rebase, merged-
                            # state gate, CI, review gate, auto-merge) run at once. Each runs as
                            # its own task OFF the loop tick, so the claim scan never waits on
                            # a slow gate or review (#462).
  claim_stall_ticks: 10     # ready work + a free slot + no finished claim scan for this many
                            # ticks → a `claim_stall` health gap on /status naming the phase
                            # the tick is stuck in (#462). 0 = off.
  ci_poll: true             # closed-loop verify: poll in_review PRs' CI check-runs and,
                            # on a FAILING rollup, bounce the feature back to the coder
                            # with the failure injected as feedback (vs the old open-loop:
                            # a red PR sat in_review forever). Rides the merge-poll cadence.
                            # Defaults to merge_poll's value; set false to disable.
  ci_fix_max: 2             # cap on CI-fix re-dispatches before the feature is Blocked for
                            # human triage (a real bug, not a self-fixable nit). 0 = never
                            # auto-fix (block on the first CI failure).
  ci_rerun_max: 1           # #487: rerun a red PR's failed GitHub Actions jobs this many times
                            # per PR head BEFORE a ci_fix_max fix round — a flaky job is not
                            # the coder's bug. Green after the rerun → a logged flake, nothing
                            # spent; red again at the same head → the usual bounce. A new push
                            # re-arms it. Needs `actions: write` on the gh token. 0 = off.
  auto_rebase: true         # keep stale in_review PRs mergeable (v0.14.0, bd-2gu). Parallel
                            # PRs branch off the SAME base and the hot-file guard serializes
                            # DISPATCH not the branch BASE, so each merge re-stales the others.
                            # BEHIND (stale, no conflict) → a clean rebase + force-push, NO
                            # coder; DIRTY (a real conflict) → re-dispatch the coder to resolve
                            # off the fresh base. Rides the merge-poll cadence; defaults to
                            # merge_poll's value; set false to disable.
  auto_merge: false         # OPT-IN, LIVE. The MERGE edge: once an in_review PR is green by
                            # every gate the loop itself runs — GitHub mergeStateStatus CLEAN
                            # (required checks + branch protection), the merged-state verdict
                            # stamped against the CURRENT base (auto_rebase), and the review
                            # gate's `review-clean` verdict (review_gate) — merge it
                            # (`gh pr merge --<merge_method> --delete-branch`); the board
                            # flips to done on the next reconcile via the one Done edge.
                            # Off = park green PRs for the adjudicator (the pre-0.39 posture).
                            # A card labelled `merge-hold` is never auto-merged — the
                            # operator's per-card veto for work they want to QA by hand.
  merge_method: squash      # squash | merge | rebase
  auto_merge_max: 3         # merge refusals (branch protection, a race) before the loop stops
                            # retrying and leaves a comment on the bead for a human. Never blocks.
  merged_verify_max: 5      # re-verify budget for the merged-state gate: how many sibling merges
                            # a held in_review card can survive, each costing one gate run
                            # against the new base (only when base actually moved). 0 = unlimited.
                            # With auto_merge on, exhaustion is a hard hold on the merge edge
                            # (logged as a WARNING) — raise it or label the card merge-hold.
  rebase_fix_max: 1         # cap on coder re-dispatches to resolve a real rebase CONFLICT
                            # before the feature is Blocked for a manual rebase. 0 = block on
                            # the first conflict (clean BEHIND rebases still run — they need no coder).
  base_refresh: true        # each health sweep (off the tick) fetches every BOARD-OWNED
                            # project's base and fast-forwards its MAIN checkout when it is clean
                            # and on the base branch (#452). Board-owned = under the onboarding
                            # root or registered by the board; a project entry's own
                            # `base_refresh: true|false` overrides. A checkout it can't move
                            # safely is left alone and reported stale on /status. false = off.
  health_sweep_interval_s: 300  # periodic self-heal: reclaim slots from dead drives
  # A repeated coder timeout is a SIZE signal, not a capability one: it carries no diff and
  # no CI output, so a retry gets a near-identical prompt and a tier climb spends a stronger
  # model on a card that was never model-limited. After this many timeouts on FRESH builds of
  # one card (never a pre-first-token or fix-round timeout; the count clears when a build
  # reaches review), the loop parks the card and files a task asking the board's own agent to
  # split it (once per card) — no further tier climb or rebuild. Unblocking resets it. 0 = off.
  decompose_after_timeouts: 2
                            # (in_progress with no live drive → ready) + reap orphaned
                            # feat-<id> worktrees (feature gone/done). 0 disables it.
  br_autofetch: true        # `br` fetched on first run (v0.43.0). With no `br` on PATH the
                            # plugin downloads the PINNED beads-rust release binary
                            # (br_fetch.BR_VERSION, sha256-verified per platform: darwin
                            # arm64/x64, linux x64/arm64 — not Windows) into the instance's
                            # plugin-data dir and uses it; no Rust toolchain, no restart.
                            # Needs egress to github.com. false = the pre-0.43 posture: a
                            # missing `br` is a setup gap with the install hint. Resolution
                            # order for the binary: BR_BIN env > fetched > PATH. LIVE.
  db_path: ""               # beads board db. Blank (the default; D3, #260) → the ONE
                            # instance-default store — <instance plugin-data>/
                            # project_board/.beads/beads.db, bootstrapped automatically
                            # on first use. Every project on this board shares it (a
                            # multi-repo board is still ONE board), and `br init` never
                            # runs inside a project repo. Set an explicit path to pin
                            # the board db somewhere specific instead; the pin is passed
                            # verbatim (`--db`) to every board op and nothing is created
                            # on your behalf (`br init` it yourself). An explicitly
                            # blank value is the same as leaving the key out — the
                            # pre-D3 per-repo `.beads/` discovery is gone. A pre-D3
                            # board kept its cards IN the repo's .beads/: the setup
                            # preflight flags a repo still carrying one; point db_path
                            # at that .beads/<file>.db to keep reading those cards
                            # (see docs/annotated-config.md "Upgrading a pre-D3 board").
  webhook_secret: ""        # HMAC secret for every public mutation: /webhook/pr,
                            # /features/<id>/ci, and /review. Blank → all three fail
                            # closed (503). Or set PROJECT_BOARD_WEBHOOK_SECRET.
  npm_token: ""             # OPTIONAL npm registry token for `waits_for: npm:…` publish gates
                            # on PRIVATE packages. Blank = anonymous reads (public packages).
                            # Or set PROJECT_BOARD_NPM_TOKEN (then NPM_TOKEN).

# Configure-dialog information architecture (protoAgent #3179/#3180). `projects` is
# plugin-owned UI because a keyed map is not an honest scalar field; the other tabs use
# the generic schema renderer. min_protoagent_version keeps hosts without this contract
# from loading a Configure surface they cannot render faithfully.
settings_tabs:
  - { id: projects, label: "Projects", path: /plugins/project_board/config/projects }
  - { id: routing, label: "Coder routing", path: /plugins/project_board/config/routing }
  - { id: automation, label: "Automation" }
  - { id: review, label: "Review & merge" }
  - { id: security, label: "Security" }

# Console settings. `restart: true` is deliberate: only LIVE_KNOBS are re-applied by
# BoardLoop.reload; every other exposed scalar is useful/operator-safe but remains the
# boot-time value until the member restarts. Structural routing lives in Projects, and
# machine/internal tuning stays file-only (documented in docs/configuration.md).
settings:
  - { key: loop_enabled, label: "Build ready cards automatically", type: bool, group: "Project Board", tab: automation, restart: true,
      description: "Start building ready cards after restart, or turn off to keep the board and tools available without starting builds." }
  - { key: decompose_after_timeouts, label: "Timeouts before asking to split a card", type: number, minimum: 0, maximum: 10, group: "Project Board", tab: automation, restart: true,
      description: "After this many fresh-build timeouts, pause the card and ask to split it into smaller tasks; zero disables the request." }
  - { key: coder, label: "Coder for builds", type: string, group: "Project Board", tab: automation,
      description: "Choose the configured coder that builds cards, with changes taking effect on the next check." }
  - { key: br_autofetch, label: "Download the board tool automatically", type: bool, group: "Project Board", tab: automation,
      description: "Download and verify the missing board command-line tool from github.com, or turn off to install it yourself." }
  - { key: max_concurrent, label: "Cards building at once", type: number, minimum: 1, maximum: 64, group: "Project Board", tab: automation,
      description: "Limit how many cards build at once; lowering this limit lets running builds finish." }
  - { key: max_concurrent_sessions, label: "Parallel coding sessions per build", type: number, minimum: 0, maximum: 32, group: "Project Board", tab: automation,
      description: "Limit simultaneous coding sessions within each build; zero allows as many as the candidate budget permits." }
  - { key: max_pending_reviews, label: "Pull requests waiting for review", type: number, minimum: 0, maximum: 1000, group: "Project Board", tab: automation,
      description: "Pause new builds when this many pull requests await review; zero removes the limit." }
  - { key: goal_verify, label: "Check acceptance criteria before review", type: bool, group: "Project Board", tab: automation, restart: true,
      description: "Have an independent model check the changes against the card’s acceptance criteria, including test coverage, before opening a pull request." }
  - { key: base_refresh, label: "Update project checkouts automatically", type: bool, group: "Project Board", tab: automation, restart: true,
      description: "Keep board-owned checkouts up to date, leaving local edits, other branches, and diverged history untouched." }
  - { key: local_gate_cmd, label: "Checks before opening a pull request", type: string, group: "Project Board", tab: automation, restart: true,
      description: "Run this check command before opening a pull request unless the project overrides it; blank disables the default checks." }
  - { key: coder_solve, label: "Try solutions until tests pass", type: bool, group: "Project Board", tab: automation, restart: true,
      description: "Try and test alternative solutions when the coding plugin, acceptance criteria, and a test command are available." }
  - { key: coder_solve_test_cmd, label: "Tests for candidate solutions", type: string, group: "Project Board", tab: automation, restart: true,
      description: "Run this command to test candidate solutions, or leave blank to use the checks configured before opening a pull request." }
  - { key: max_mode_n, label: "Alternative builds to compare", type: number, minimum: 1, maximum: 16, group: "Project Board", tab: automation, restart: true,
      description: "Build each fresh card this many ways and keep the best result; one turns off alternatives, while higher values multiply coding cost." }

  - { key: auto_merge, label: "Merge approved pull requests automatically", type: bool, group: "Project Board", tab: review,
      description: "Merge pull requests when all required checks and reviews are current and passing, unless the card is held for manual approval." }
  - { key: merged_verify_max, label: "Failed checks before holding a merge", type: number, minimum: 0, maximum: 20, group: "Project Board", tab: review,
      description: "Hold automatic merging after this many failed or inconclusive checks against the latest base; zero allows unlimited attempts." }
  - { key: merge_method, label: "How to merge pull requests", type: select, options: [squash, merge, rebase], group: "Project Board", tab: review, restart: true, depends_on: { key: auto_merge },
      description: "Use this GitHub merge method when merging pull requests automatically." }
  - { key: review_gate, label: "Require review before merging", type: bool, group: "Project Board", tab: review, restart: true,
      description: "Review changes before merging and send serious findings back to the coder to fix." }
  - { key: review_workflow, label: "Workflow for required reviews", type: string, group: "Project Board", tab: review, restart: true, depends_on: { key: review_gate },
      description: "Use this configured workflow to review changes before allowing a merge." }
  - { key: reviewer, label: "Agent for pull request reviews", type: string, group: "Project Board", tab: review, restart: true,
      description: "Use this review agent for optional reviews or when required reviews have no workflow runner available." }
  - { key: review_dispatch, label: "Request an extra review on opening", type: bool, group: "Project Board", tab: review, restart: true,
      description: "Ask the review agent for an advisory review when a pull request opens." }
  - { key: review_fix_max, label: "Attempts to fix review findings", type: number, minimum: 0, maximum: 20, group: "Project Board", tab: review, restart: true, depends_on: { key: review_gate },
      description: "Let the coder fix review findings this many times before blocking the card for your attention." }
  - { key: merge_poll, label: "Check pull request status automatically", type: bool, group: "Project Board", tab: review, restart: true,
      description: "Check for merged or closed pull requests so the board stays current even when GitHub cannot send updates." }
  - { key: ci_poll, label: "Send failed checks back to the coder", type: bool, group: "Project Board", tab: review, restart: true,
      description: "Check pull request test results and send failures back to the coder to fix." }
  - { key: ci_fix_max, label: "Attempts to fix failed checks", type: number, minimum: 0, maximum: 20, group: "Project Board", tab: review, restart: true, depends_on: { key: ci_poll },
      description: "Allow this many automatic fixes for failed checks before blocking the card; zero blocks on the first failure." }
  - { key: ci_rerun_max, label: "Rerun failed checks before changing code", type: number, minimum: 0, maximum: 5, group: "Project Board", tab: review, restart: true, depends_on: { key: ci_poll },
      description: "Retry failed GitHub Actions jobs this many times before asking for a code fix; zero disables retries." }
  - { key: auto_rebase, label: "Update pull requests with base changes", type: bool, group: "Project Board", tab: review, restart: true,
      description: "Update pull requests when their base branch changes and ask the coder to resolve conflicts." }
  - { key: rebase_fix_max, label: "Attempts to fix merge conflicts", type: number, minimum: 0, maximum: 20, group: "Project Board", tab: review, restart: true, depends_on: { key: auto_rebase },
      description: "Let the coder resolve merge conflicts this many times before blocking the card." }
  - { key: dep_gate, label: "When dependent cards can start", type: select, options: [merge, review], group: "Project Board", tab: review, restart: true,
      description: "Start dependent cards after their prerequisite merges or reaches review; shared foundation changes must always merge first." }

  - { key: webhook_secret, label: "Secret for GitHub updates", type: secret, group: "Project Board", tab: security, restart: true,
      description: "Verify incoming merge, check, and review updates with this secret; blank disables public update routes." }
  - { key: npm_token, label: "Token for private package checks", type: secret, group: "Project Board", tab: security, restart: true,
      description: "Use this read token to check private npm package releases; blank checks the public registry without signing in." }

# Console view (ADR 0026) — a left-rail icon whose panel iframes the board page.
# The list/Kanban view is a projection over the /features API (no separate store).
# Served by the SAME router as the API (build_router, prefix /plugins/project_board)
# so the declared path is genuinely mounted — a second router at the same prefix would
# be silently dropped by the host's (plugin_id, prefix) router-dedupe. UNGATED prefix
# (/plugins/<id>, like the sibling agent-browser/doom plugins) because the iframe src
# is a browser navigation that can't attach a bearer.
views:
  - { id: board, label: "Board", icon: LayoutGrid, path: /plugins/project_board/board }

# Board cards in chat (#522, ADR 0118 D5): the `board-cards` component renders in a
# plugin-served page the console frames on an OPAQUE origin with no bearer, so the page
# must be auth-exempt. It carries no board data — the cards arrive through the host's
# mediated reads of the GATED /api/plugins/project_board routes (protoAgent#4143).
public_paths:
  - /plugins/project_board/component/

# Declarative only (transparency in the console).
capabilities:
  network: ["*"]            # br (beads) + gh pr create + delegate_to(reviewer) over A2A
  filesystem: worktree      # creates/removes git worktrees under worktrees_root; beads in .beads/
