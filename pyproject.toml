[project]
name = "project-board"
version = "0.49.0"
description = "Board-driven coding-orchestration plugin for protoAgent (beads board + ACP spawn loop + planning layer + console view)."
requires-python = ">=3.11"

# Runtime deps come from the protoAgent host (langchain-core, fastapi) — this plugin
# adds none. The only external dependency is the `br` (beads) CLI on PATH, plus
# git + the gh CLI. So `requires_pip` in the manifest is empty.

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]
markers = [
    # #138: the `br --json` SHAPE contract — tests that must hold on BOTH br 0.1.x
    # (bare list) and 0.2.x (envelope). The CI matrix runs `-m br_shape` on the 0.2.16
    # leg; the 0.1.23 leg runs the whole suite (these plus the 0.1.x-quirk pins).
    "br_shape: real-br test that asserts the version-agnostic --json shape contract (#138)",
]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W"]
ignore = ["E402", "E501", "E702", "E731", "E741"]

[tool.ruff.lint.per-file-ignores]
"**/__init__.py" = ["F401"]
# The loop/ package (#268) shares one module-level kernel: each edge module does
# `from ._common import *` so its lifted-verbatim methods see the exact globals the
# monolithic loop.py had. That is a deliberate star re-export, so F403 (star import)
# and F405 (name may be from a star import) are expected here, not smells.
"loop/*.py" = ["F403", "F405"]
