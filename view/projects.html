<!doctype html><html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Project Board projects</title>
<style>__PROJECTS_CSS__</style>
<script>
var BASE = location.pathname.split("/plugins/")[0];
(function(){var l=document.createElement("link");l.rel="stylesheet";
  l.href=BASE+"/_ds/plugin-kit.css";document.head.appendChild(l);})();
</script></head><body>
<main class="wrap">
  <div id="notice" class="pl-callout" hidden role="status"><span id="notice-text"></span></div>
  <div class="head">
    <div><h1>Boarded projects</h1><p>Repos this board may dispatch work into. Changes apply live.</p></div>
    <button id="add" class="btn primary" type="button">Add project</button>
  </div>
  <div id="onboarding" class="pl-callout pl-callout--warning" hidden></div>
  <div id="error" class="pl-callout pl-callout--error callout-row" hidden role="alert"><span id="error-text"></span><button id="retry" class="btn" type="button">Retry</button></div>
  <div id="loading" class="empty">Loading projects…</div>
  <div id="projects"></div>
  <section id="editor" class="panel" hidden aria-labelledby="editor-title">
    <div class="panel-head"><h2 id="editor-title">Add project</h2><button id="cancel" class="btn" type="button">Cancel</button></div>
    <form id="form">
      <input id="original-name" type="hidden">
      <label>Project key<input id="name" name="name" required pattern="[A-Za-z0-9][A-Za-z0-9_-]*" autocomplete="off"><small>Stable key stamped onto board cards. Existing keys cannot be renamed.</small></label>
      <label>Repository path<input id="repo" name="repo" type="text" required autocomplete="off"><small>Must be an existing Git checkout under the configured onboarding root.</small></label>
      <label>Base branch<input id="base" name="base_branch" type="text" value="main" required autocomplete="off"></label>
      <label>Local gate command<input id="gate" name="local_gate_cmd" type="text" autocomplete="off"><small>Optional repo-specific fast test/lint gate.</small></label>
      <label>Repository conventions<textarea id="conventions" name="repo_conventions" rows="4"></textarea><small>Rules injected into coder dispatches: test, changelog, and import conventions.</small></label>
      <label class="check"><input id="default" name="make_default" type="checkbox"> Use for new cards that do not name a project</label>
      <div class="actions"><button id="save" class="btn primary" type="submit">Save project</button></div>
    </form>
  </section>
</main>
<script type="module">__PROJECTS_JS__</script></body></html>
