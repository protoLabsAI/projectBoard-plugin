name: CI

# Lint + test the plugin. Runs on the org's Namespace Linux profile (not a
# GitHub-hosted runner) to keep CI cost down — the same profile the rest of the
# org's repos use. Falls back to a hosted runner on a fork that lacks the
# profile by overriding the NSC_RUNNER repo variable.
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    runs-on: ${{ vars.NSC_RUNNER || 'namespace-profile-protolabs-linux' }}
    name: test (br ${{ matrix.br_version }})
    # #138: `br` 0.2.16 changed the --json payload shape ([] → {"issues":[…]}). The seam
    # normalizes both, so the shape contract must hold on BOTH versions — run the real-br
    # integration tier across a version matrix instead of a single pinned binary.
    #   0.1.23 (the version we run locally + pin to): the FULL suite gates here, including
    #          the tests that pin 0.1.x-SPECIFIC quirks (the 50-char label cap,
    #          contention-as-JSON-on-zero-exit). NB: `br ready --json` omitting labels is
    #          no longer a 0.1.x-quirk pin (#324) — ready_queue re-fetches labels only when
    #          the row lacks them, so that contract is version-AWARE and rides `-m br_shape`
    #          on every leg (label-less path here, label-carrying path on the newer legs).
    #   0.2.16: only `-m br_shape` — the version-agnostic --json SHAPE contract. The
    #          0.1.x-quirk pins would rightly disagree with 0.2.16; running them here would
    #          test beads, not the plugin's shape handling (see tests/test_integration.py).
    #   0.3.2 (= br_fetch.BR_VERSION, the binary a fresh member AUTO-FETCHES since v0.43.0):
    #          `-m br_shape` as well. tests/test_br_fetch.py pins this leg's asset + sha256
    #          to the plugin's own linux_amd64 pin, so the fetched binary is always one CI
    #          proved the store against — move the pin and this leg together.
    # An upgrade lands deliberately by moving a pin (URL + sha256) alongside the code,
    # never via "latest". Each sha256 is from the release's published checksums.sha256.
    # fail-fast off so a red on one version still reports the other.
    strategy:
      fail-fast: false
      matrix:
        include:
          - br_version: "0.1.23"
            br_asset: "br-v0.1.23-linux_amd64.tar.gz" # 0.1.x assets carry the `v` prefix
            br_sha256: "2f0d70865eba171e845a4f616151893def534ad83e0b0bc8e216a827f1f9f6dc"
            pytest_args: "" # full suite
          - br_version: "0.2.16"
            br_asset: "br-0.2.16-linux_amd64.tar.gz" # 0.2.x assets dropped the `v` prefix
            br_sha256: "9ee22d340b56dacfb20460d8e4b2a0065fb66f161910472285d55f51e04512b0"
            pytest_args: "-m br_shape" # only the version-agnostic --json shape contract
          - br_version: "0.3.2" # the auto-fetch pin (br_fetch.BR_VERSION) — keep in lockstep
            br_asset: "br-0.3.2-linux_amd64.tar.gz"
            br_sha256: "e67c560e77e912490e44a65e3e9c13205210d171e729c5d801072ee508207288"
            pytest_args: "-m br_shape"
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dev deps
        # Pin ruff — an unpinned `ruff` floats to latest, which formats differently
        # than the dev's ruff, so `ruff format --check` fails on already-formatted
        # files (main carried this mismatch). Pin both sides to keep them in step.
        run: pip install -r requirements-dev.txt ruff==0.15.10

      - name: Install beads (br ${{ matrix.br_version }}) — pinned prebuilt release binary
        # The real-br integration tier (tests/test_integration.py, #136) shells the ACTUAL
        # `br`. A prebuilt release asset — download + untar, no Rust toolchain in CI. The
        # asset name differs by version (0.1.x has a `v` prefix, 0.2.x doesn't), so it rides
        # the matrix; the sha256 pins the exact bytes (from the release's checksums.sha256).
        run: |
          curl -fsSL -o /tmp/br.tar.gz \
            "https://github.com/Dicklesworthstone/beads_rust/releases/download/v${{ matrix.br_version }}/${{ matrix.br_asset }}"
          echo "${{ matrix.br_sha256 }}  /tmp/br.tar.gz" | sha256sum -c -
          mkdir -p "$HOME/.local/bin"
          tar -xzf /tmp/br.tar.gz -C "$HOME/.local/bin" br
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          "$HOME/.local/bin/br" --version

      - name: Lint
        run: ruff check . && ruff format --check .

      - name: Test
        # PB_REQUIRE_BR turns an absent `br` into a FAILURE (the guard test in
        # tests/test_integration.py, itself @br_shape so it runs on BOTH legs) instead of a
        # silent skip of the integration tier — a silent skip is a fake with extra ceremony
        # (#136). `pytest_args` is empty on 0.1.23 (full suite) and `-m br_shape` on 0.2.16.
        env:
          PB_REQUIRE_BR: "1"
        run: pytest -q ${{ matrix.pytest_args }}

  test-gh:
    # The real-GitHub integration tier (#361 slice 2, tests/test_worktree_gh.py): the ACTUAL
    # `gh`/GitHub against a real OPEN PR. It exercises the 12 read-dominant worktree GitHub seams a
    # mocked `_gh` cannot validate — the blindness that shipped #354 (a PAT that cannot POST
    # /check-runs, green through every mock). It needs a credential that can create the ONE
    # idempotent commit status (statuses: write) + ONE idempotent marked comment
    # (pull-requests/issues: write) on that PR, and the PR's URL.
    #
    # The fixture PR is resolved by PB_GH_FIXTURE_PR (below): it PREFERS the maintained
    # `PB_GH_FIXTURE_PR` repo variable — a dedicated, pinned, permanently-open fixture PR when a
    # maintainer wires one — and otherwise FALLS BACK to the PR under test, which is itself a real
    # open PR while its own checks run. Either way the tier reads a real open PR and does its two
    # idempotent writes on it under DISPOSABLE contexts (distinct from the production review-gate
    # status/comment, so it never disturbs a real review signal); `merge_pr` is exercised with a
    # deliberately wrong `expected_head` so GitHub refuses it atomically and the PR is never merged.
    #
    # Runs where that credential AND a resolvable fixture PR both exist: same-repo PRs (the loop
    # opens its PRs from same-repo branches; the fixture defaults to the PR itself), and
    # pushes/dispatch ONLY when the repo variable pins a dedicated PR. NOT fork PRs, whose
    # GITHUB_TOKEN is read-only and whose secrets are withheld — the credential-absent case the
    # tier skips, not a silent skip; the enforced same-repo legs cover every PR the loop actually
    # opens. `contents` stays READ so the token cannot merge — belt-and-suspenders with the
    # wrong-`expected_head` refusal in the merge_pr test.
    if: >-
      (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository)
      || (github.event_name != 'pull_request' && vars.PB_GH_FIXTURE_PR != '')
    runs-on: ${{ vars.NSC_RUNNER || 'namespace-profile-protolabs-linux' }}
    name: test (real gh)
    permissions:
      contents: read
      statuses: write
      pull-requests: write
      issues: write
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dev deps
        run: pip install -r requirements-dev.txt

      - name: Verify gh is present
        run: gh --version

      - name: Test (real-GitHub tier)
        # PB_REQUIRE_GH=1 turns an absent/unusable credential — or an unresolvable fixture PR —
        # into a FAILURE (the guard test in tests/test_worktree_gh.py) instead of a silent skip of
        # the whole tier: a silent skip is exactly how #354 shipped green. GH_TOKEN is the ambient
        # `gh` credential (no token is embedded in the suite). PB_GH_FIXTURE_PR is the maintained
        # repo variable when a maintainer sets it (a dedicated pinned permanently-open fixture PR),
        # else the PR under test's own URL — both are PUBLIC PR identifiers, never credentials (r6).
        env:
          PB_REQUIRE_GH: "1"
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PB_GH_FIXTURE_PR: ${{ vars.PB_GH_FIXTURE_PR || github.event.pull_request.html_url }}
        run: pytest -q tests/test_worktree_gh.py
